<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="1200" height="240" role="img" aria-label="Abhinav — Software Engineer, Fintech, Problem Solver">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="50%" stop-color="#0f1729"/>
      <stop offset="100%" stop-color="#0a0e1a"/>
    </linearGradient>

    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#a8e7ff"/>
      <stop offset="100%" stop-color="#64ffda"/>
    </linearGradient>

    <linearGradient id="trendGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#64ffda" stop-opacity="0"/>
      <stop offset="100%" stop-color="#64ffda" stop-opacity="0.18"/>
    </linearGradient>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>

    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.7" fill="#1a2540"/>
    </pattern>

    <path id="trend" d="M 0,200 Q 80,180 140,170 T 260,150 Q 340,140 400,135 T 540,120 Q 620,108 680,98 T 820,80 Q 900,65 960,55 T 1100,40 L 1200,32"/>
  </defs>

  <!-- Background -->
  <rect width="1200" height="240" fill="url(#bg)"/>
  <rect width="1200" height="240" fill="url(#dots)" opacity="0.7"/>

  <!-- Horizontal price-grid lines -->
  <g stroke="#1c2a4a" stroke-width="0.5" opacity="0.5">
    <line x1="0" y1="60"  x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
  </g>

  <!-- Y-axis price labels -->
  <g font-family="monospace" font-size="9" fill="#3a5080" opacity="0.8">
    <text x="1175" y="58">24,800</text>
    <text x="1175" y="118">24,600</text>
    <text x="1175" y="178">24,400</text>
  </g>

  <!-- Candlesticks: left cluster (mixed) -->
  <g opacity="0.55">
    <g transform="translate(40,0)">
      <line x1="0" y1="70"  x2="0" y2="170" stroke="#64ffda" stroke-width="1"/>
      <rect x="-4" y="100" width="8" height="50" fill="#64ffda" fill-opacity="0.55" stroke="#64ffda" stroke-width="1"/>
    </g>
    <g transform="translate(70,0)">
      <line x1="0" y1="55"  x2="0" y2="185" stroke="#ff6b6b" stroke-width="1"/>
      <rect x="-4" y="80"  width="8" height="70" fill="#ff6b6b" fill-opacity="0.55" stroke="#ff6b6b" stroke-width="1"/>
    </g>
    <g transform="translate(100,0)">
      <line x1="0" y1="80"  x2="0" y2="175" stroke="#64ffda" stroke-width="1"/>
      <rect x="-4" y="110" width="8" height="45" fill="#64ffda" fill-opacity="0.55" stroke="#64ffda" stroke-width="1"/>
    </g>
    <g transform="translate(130,0)">
      <line x1="0" y1="65"  x2="0" y2="165" stroke="#64ffda" stroke-width="1"/>
      <rect x="-4" y="90"  width="8" height="55" fill="#64ffda" fill-opacity="0.55" stroke="#64ffda" stroke-width="1"/>
    </g>
    <g transform="translate(160,0)">
      <line x1="0" y1="50"  x2="0" y2="160" stroke="#ff6b6b" stroke-width="1"/>
      <rect x="-4" y="75"  width="8" height="55" fill="#ff6b6b" fill-opacity="0.55" stroke="#ff6b6b" stroke-width="1"/>
    </g>
    <g transform="translate(190,0)">
      <line x1="0" y1="60"  x2="0" y2="155" stroke="#64ffda" stroke-width="1"/>
      <rect x="-4" y="85"  width="8" height="55" fill="#64ffda" fill-opacity="0.55" stroke="#64ffda" stroke-width="1"/>
    </g>
  </g>

  <!-- Candlesticks: right cluster (mostly bullish, rising) -->
  <g opacity="0.55" transform="translate(940,0)">
    <g transform="translate(0,0)">
      <line x1="0" y1="60" x2="0" y2="165" stroke="#64ffda" stroke-width="1"/>
      <rect x="-4" y="85" width="8" height="60" fill="#64ffda" fill-opacity="0.55" stroke="#64ffda" stroke-width="1"/>
    </g>
    <g transform="translate(30,0)">
      <line x1="0" y1="48" x2="0" y2="150" stroke="#64ffda" stroke-width="1"/>
      <rect x="-4" y="72" width="8" height="65" fill="#64ffda" fill-opacity="0.55" stroke="#64ffda" stroke-width="1"/>
    </g>
    <g transform="translate(60,0)">
      <line x1="0" y1="55" x2="0" y2="160" stroke="#ff6b6b" stroke-width="1"/>
      <rect x="-4" y="78" width="8" height="55" fill="#ff6b6b" fill-opacity="0.55" stroke="#ff6b6b" stroke-width="1"/>
    </g>
    <g transform="translate(90,0)">
      <line x1="0" y1="38" x2="0" y2="142" stroke="#64ffda" stroke-width="1"/>
      <rect x="-4" y="60" width="8" height="68" fill="#64ffda" fill-opacity="0.55" stroke="#64ffda" stroke-width="1"/>
    </g>
    <g transform="translate(120,0)">
      <line x1="0" y1="32" x2="0" y2="135" stroke="#64ffda" stroke-width="1"/>
      <rect x="-4" y="52" width="8" height="62" fill="#64ffda" fill-opacity="0.55" stroke="#64ffda" stroke-width="1"/>
    </g>
    <g transform="translate(150,0)">
      <line x1="0" y1="28" x2="0" y2="125" stroke="#64ffda" stroke-width="1"/>
      <rect x="-4" y="45" width="8" height="58" fill="#64ffda" fill-opacity="0.55" stroke="#64ffda" stroke-width="1"/>
    </g>
    <g transform="translate(180,0)">
      <line x1="0" y1="22" x2="0" y2="118" stroke="#64ffda" stroke-width="1"/>
      <rect x="-4" y="38" width="8" height="60" fill="#64ffda" fill-opacity="0.55" stroke="#64ffda" stroke-width="1"/>
    </g>
    <g transform="translate(210,0)">
      <line x1="0" y1="20" x2="0" y2="110" stroke="#64ffda" stroke-width="1"/>
      <rect x="-4" y="32" width="8" height="55" fill="#64ffda" fill-opacity="0.55" stroke="#64ffda" stroke-width="1"/>
    </g>
  </g>

  <!-- Trend line area fill -->
  <path d="M 0,200 Q 80,180 140,170 T 260,150 Q 340,140 400,135 T 540,120 Q 620,108 680,98 T 820,80 Q 900,65 960,55 T 1100,40 L 1200,32 L 1200,240 L 0,240 Z"
        fill="url(#trendGrad)" opacity="0.6"/>

  <!-- Animated trend line -->
  <use href="#trend" stroke="#64ffda" stroke-width="2.5" fill="none" filter="url(#glow)"
       stroke-dasharray="2400" stroke-dashoffset="2400">
    <animate attributeName="stroke-dashoffset" from="2400" to="0" dur="3.5s" begin="0s" fill="freeze"/>
  </use>

  <!-- Glow halo behind dot -->
  <circle r="10" fill="#64ffda" filter="url(#softGlow)" opacity="0.4">
    <animateMotion dur="7s" repeatCount="indefinite" begin="3s">
      <mpath href="#trend"/>
    </animateMotion>
  </circle>

  <!-- Tracker dot riding the trend line -->
  <circle r="4" fill="#64ffda" stroke="#0a0e1a" stroke-width="1.5">
    <animateMotion dur="7s" repeatCount="indefinite" begin="3s">
      <mpath href="#trend"/>
    </animateMotion>
  </circle>

  <!-- LIVE indicator -->
  <g transform="translate(40,28)">
    <circle cx="0" cy="0" r="4" fill="#64ffda">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <text x="12" y="4" font-family="'JetBrains Mono', monospace" font-size="11" fill="#64ffda" font-weight="600" letter-spacing="1.5">
      LIVE · BUILDING IN INDIA
    </text>
  </g>

  <!-- Ticker top-right -->
  <g transform="translate(1010,28)" font-family="'JetBrains Mono', monospace">
    <text x="0" y="0"  font-size="10.5" fill="#a0a0c0" font-weight="600" letter-spacing="1">NIFTY</text>
    <text x="40" y="0" font-size="10.5" fill="#ffffff" font-weight="600">24,712</text>
    <text x="92" y="0" font-size="10.5" fill="#64ffda" font-weight="600">▲ 1.42%</text>
    <text x="0"  y="15" font-size="9.5" fill="#a0a0c0" font-weight="500" letter-spacing="1">SENSEX</text>
    <text x="40" y="15" font-size="9.5" fill="#ffffff" font-weight="500">81,403</text>
    <text x="92" y="15" font-size="9.5" fill="#64ffda" font-weight="500">▲ 0.88%</text>
  </g>

  <!-- Name (center, large) -->
  <text x="600" y="130" font-family="'JetBrains Mono', 'Courier New', monospace" font-weight="800"
        font-size="74" fill="url(#nameGrad)" text-anchor="middle" filter="url(#glow)">
    Abhinav
    <animate attributeName="opacity" from="0" to="1" dur="1.5s" fill="freeze"/>
  </text>

  <!-- Subtitle -->
  <text x="600" y="170" font-family="'JetBrains Mono', 'Courier New', monospace" font-weight="500"
        font-size="14" fill="#a0a0c0" text-anchor="middle" letter-spacing="4">
    SOFTWARE ENGINEER · FINTECH · PROBLEM SOLVER
    <animate attributeName="opacity" from="0" to="1" dur="2s" begin="0.6s" fill="freeze"/>
  </text>

  <!-- Terminal prompt bottom-left -->
  <g transform="translate(40,215)" font-family="'JetBrains Mono', monospace">
    <text x="0" y="0" font-size="11" fill="#64ffda" font-weight="700">~/abhinav $</text>
    <text x="80" y="0" font-size="11" fill="#a0a0c0">./build_for_india --markets=NSE,BSE</text>
    <rect x="290" y="-9" width="7" height="11" fill="#64ffda">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Bottom-right tagline -->
  <g transform="translate(1160,215)" font-family="'JetBrains Mono', monospace" text-anchor="end">
    <text x="0" y="0" font-size="10" fill="#3a5080" letter-spacing="2">CODE · CAPITAL · CURIOSITY</text>
  </g>
</svg>
